name: Publish websites to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "naiwa-tea/**"
      - "safe-after-school/**"
      - "suika-the-politician/**"
      - "merge-merz/**"
      - "mothers-day-flower-garden/**"
      - "index.html"
      - "script.js"
      - "styles.css"
      - ".github/workflows/deploy-naiwa-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare websites
        run: |
          mkdir -p _site/safe-after-school _site/suika-the-politician
          cp -a naiwa-tea/. _site/
          cp safe-after-school/index.html _site/safe-after-school/index.html
          cp suika-the-politician/index.html _site/suika-the-politician/
          cp suika-the-politician/preview.webp _site/suika-the-politician/
          cp -a suika-the-politician/assets suika-the-politician/scripts suika-the-politician/styles _site/suika-the-politician/
          mkdir -p _site/merge-merz
          cp merge-merz/index.html merge-merz/preview.webp _site/merge-merz/
          cp -a merge-merz/assets merge-merz/scripts merge-merz/styles _site/merge-merz/
          mkdir -p _site/mothers-day-flower-garden _site/christmas-tree
          cp mothers-day-flower-garden/index.html mothers-day-flower-garden/script.js mothers-day-flower-garden/styles.css _site/mothers-day-flower-garden/
          cp index.html script.js styles.css _site/christmas-tree/
          touch _site/.nojekyll
      - name: Package static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
