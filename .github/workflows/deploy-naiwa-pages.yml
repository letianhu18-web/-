name: Publish websites to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "games/**"
      - "agent/**"
      - ".github/workflows/deploy-naiwa-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare websites
        run: |
          mkdir -p _site/safe-after-school _site/suika-the-politician
          cp -a games/naiwa-tea/. _site/
          cp games/safe-after-school/index.html _site/safe-after-school/index.html
          cp games/suika-the-politician/index.html _site/suika-the-politician/
          cp games/suika-the-politician/preview.webp _site/suika-the-politician/
          cp -a games/suika-the-politician/assets games/suika-the-politician/scripts games/suika-the-politician/styles _site/suika-the-politician/
          mkdir -p _site/merge-merz
          cp games/merge-merz/index.html games/merge-merz/preview.webp _site/merge-merz/
          cp -a games/merge-merz/assets games/merge-merz/scripts games/merge-merz/styles _site/merge-merz/
          mkdir -p _site/mothers-day-flower-garden _site/christmas-tree
          cp agent/mothers-day-flower-garden/{index.html,script.js,styles.css} _site/mothers-day-flower-garden/
          cp agent/christmas-tree/{index.html,script.js,styles.css} _site/christmas-tree/
          touch _site/.nojekyll
      - name: Package static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
