name: Publish websites to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "naiwa-tea/**"
      - "safe-after-school/**"
      - ".github/workflows/deploy-naiwa-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare both websites
        run: |
          mkdir -p _site/safe-after-school
          cp -a naiwa-tea/. _site/
          cp safe-after-school/index.html _site/safe-after-school/index.html
          touch _site/.nojekyll
      - name: Package static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
