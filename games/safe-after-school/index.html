<title>今天也要平安下班</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: start sheet in a 560px column; in play, a full-screen top-down campus canvas under a blackboard HUD, events slide up as 聯絡簿 paper sheets */
:root{
  --paper:#eef1ea; --sheet:#fbfcf8; --ink:#1d2725; --muted:#5f6b66; --rule:#cfd8d0;
  --blue:#2b4b9b; --red:#c3352b; --board:#2c443a; --board-ink:#eef3ea; --chalk:#f2d36b;
  --good:#2f7a52; --shadow:0 1px 0 rgba(29,39,37,.08),0 6px 18px -10px rgba(29,39,37,.35);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121815; --sheet:#1b2320; --ink:#e4e9e3; --muted:#9aa7a0; --rule:#2c3833;
  --blue:#93abff; --red:#ff6d5e; --board:#22362e; --board-ink:#eef3ea; --chalk:#f2d36b;
  --good:#6fd39a; --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121815; --sheet:#1b2320; --ink:#e4e9e3; --muted:#9aa7a0; --rule:#2c3833;
  --blue:#93abff; --red:#ff6d5e; --board:#22362e; --board-ink:#eef3ea; --chalk:#f2d36b;
  --good:#6fd39a; --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

/* Game shell */
#game{position:fixed;inset:0;display:flex;flex-direction:column;background:#33402f;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hud{background:var(--board);color:var(--board-ink);padding:8px 14px 9px;display:grid;gap:6px;border-bottom:3px solid #6b5132;flex:none}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:var(--f-display);font-weight:900;font-size:28px;line-height:1;font-variant-numeric:tabular-nums;color:var(--chalk)}
.hud-right{display:flex;align-items:center;gap:10px}
.peace{text-align:right;font-size:10px;letter-spacing:.08em;opacity:.85;line-height:1.3}
.peace b{display:block;font-size:18px;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--board-ink)}
.pausebtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--board-ink);border-radius:4px;padding:4px 8px;font-size:12px}
.meters{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:11px}
.bar{height:7px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.bar i{display:block;height:100%;transition:width .5s ease}
.bar.comp i{background:linear-gradient(90deg,#e9c46a,#e76f51 60%,#ff3b30)}
.bar.stress i{background:#9ec5e8}
.lvl{font-variant-numeric:tabular-nums;min-width:5.5em;text-align:right}
.rels{display:flex;gap:5px;flex-wrap:wrap;font-size:10.5px}
.rels span{padding:0 6px;border:1px solid rgba(255,255,255,.25);border-radius:999px;font-variant-numeric:tabular-nums}
.goal{font-size:12px;color:var(--chalk);min-width:0}
.goalrow{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:space-between}
.inv{display:flex;gap:4px;flex-wrap:wrap}
.inv span{font-size:10.5px;color:#fff;padding:1px 6px;border-radius:3px}
.snark{font-family:var(--f-hand);font-size:16px;line-height:1.6;color:var(--blue);margin:0}
.snark b{font-family:var(--f-ui);font-size:12px;letter-spacing:.08em}
.shieldmsg{border-left-color:var(--good)!important;background:color-mix(in srgb,var(--good) 10%,var(--sheet))!important}
.disc{font-size:12px;color:var(--red);margin-top:10px;letter-spacing:.05em}
.lede b{color:var(--red)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:calc(100% - 32px);background:rgba(20,26,23,.88);color:#f3f1e6;padding:7px 14px;border-radius:6px;font-size:13.5px;text-align:center;pointer-events:none;transition:opacity .3s;opacity:0}
#toast.on{opacity:1}
#shade{position:absolute;inset:0;background:rgba(10,14,12,.45)}
#modal{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;padding:0 12px 14px;overscroll-behavior:contain}
#modal .sheet{max-width:560px;margin:0 auto}
#pauseMsg{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,14,12,.55);color:#fff;font-family:var(--f-display);font-size:28px;letter-spacing:.3em}
.ctlhint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:999px;pointer-events:none;white-space:nowrap;transition:opacity .6s}

/* Paper sheet */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);margin-top:16px;padding:18px 18px 20px;position:relative;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-position:0 12px}
.sheet-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.cat{font-family:var(--f-display);font-weight:900;color:var(--red);border:2px solid var(--red);padding:0 6px;border-radius:3px;letter-spacing:.1em;transform:rotate(-3deg);display:inline-block;background:var(--sheet)}
.sheet h2{font-family:var(--f-display);font-weight:900;font-size:21px;line-height:1.35;margin-top:10px}
.narr{font-family:var(--f-hand);font-size:17.5px;line-height:32px;margin:8px 0 0;max-width:60ch}
.choices{display:grid;gap:9px;margin-top:14px}
.card{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 13px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s, box-shadow .12s}
.card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.card .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--blue);color:var(--blue);font-weight:700;display:grid;place-items:center;font-size:13px}
.card .t{min-width:0;font-size:15px;font-weight:500;line-height:1.5;padding-top:1px}
.card[disabled]{opacity:.35;box-shadow:none;cursor:default;transform:none}
.card.picked{opacity:1;border-color:var(--blue);box-shadow:3px 3px 0 var(--blue)}
.hint3{font-size:12px;color:var(--muted);margin-top:8px}
.result{margin-top:16px;padding-top:14px;border-top:2px dashed var(--rule);display:grid;gap:10px}
.result .narr{margin:0}
.stamp{justify-self:start;font-family:var(--f-display);font-weight:900;font-size:24px;color:var(--red);border:3px double var(--red);padding:2px 12px;letter-spacing:.15em;transform:rotate(-6deg);animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}
.stamp.calm{color:var(--good);border-color:var(--good);font-size:18px}
@keyframes slam{from{transform:scale(2.4) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
.reason{font-size:14px;color:var(--red);font-weight:500}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.deltas span{font-size:12px;padding:1px 8px;border-radius:3px;background:var(--paper);border:1px solid var(--rule);font-variant-numeric:tabular-nums}
.deltas .bad{color:var(--red)}
.deltas .ok{color:var(--good)}
.issue{font-size:12px;color:var(--muted)}
.issue b{color:var(--ink);font-weight:500}
.omen{font-family:var(--f-hand);font-size:15px;color:var(--muted)}
.alert{font-size:13px;padding:8px 10px;border-left:4px solid var(--red);background:color-mix(in srgb,var(--red) 8%,var(--sheet))}
.go{justify-self:stretch;margin-top:4px;padding:12px;border:none;border-radius:6px;background:var(--ink);color:var(--sheet);font-weight:700;letter-spacing:.1em}

/* Start */
.hero{padding-block:36px 8px}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--muted)}
.title{font-family:var(--f-display);font-weight:900;font-size:clamp(38px,11vw,60px);line-height:1.1;margin-top:8px;letter-spacing:.02em}
.title em{font-style:normal;color:var(--red)}
.tag{font-family:var(--f-hand);font-size:20px;margin-top:10px}
.lede{color:var(--muted);max-width:52ch;margin-top:8px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px;font-size:13px}
.how div{padding:8px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet)}
.how b{display:block;font-size:13px}
.tcard{margin-top:20px}
.tname{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tname h3{font-family:var(--f-display);font-size:22px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;margin-top:10px;font-size:13px}
.stat{display:grid;grid-template-columns:5.5em 1fr 2em;gap:6px;align-items:center}
.stat .bar{background:var(--rule);height:6px}
.stat .bar i{background:var(--blue)}
.stat span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.talents{display:grid;gap:8px;margin-top:14px}
.tal{padding:8px 10px;border:1px dashed var(--muted);border-radius:4px;background:var(--sheet)}
.tal b{color:var(--red)}
.tal p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.sys{font-family:var(--f-hand);font-size:17px;margin-top:12px;color:var(--blue)}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.row button{flex:1 1 140px;padding:12px;border-radius:6px;font-weight:700;letter-spacing:.08em}
.primary{background:var(--red);color:#fff;border:none}
.ghost{background:transparent;border:1.5px solid var(--ink)}
.best{font-size:12px;color:var(--muted);margin-top:10px}

.big-btn{display:block;width:100%;max-width:320px;margin-top:22px;padding:15px;border-radius:8px;font-size:17px;font-weight:700;letter-spacing:.1em}
.lede b{color:var(--red);font-size:1.15em}
.nth{font-size:18px;margin-top:10px}
.nth b{font-family:var(--f-display);font-size:30px;color:#ff4b3e;font-variant-numeric:tabular-nums}
.over.win .nth b{color:var(--red)}
.realbox{margin-top:22px;padding:16px;border:1px solid rgba(255,255,255,.25);border-radius:6px;background:rgba(255,255,255,.04)}
.realbox p{margin:8px 0 0;font-size:15.5px;line-height:1.75}
.realtag{display:inline-block;font-family:var(--f-display);font-weight:900;color:#ff4b3e;border:2px solid #ff4b3e;padding:0 8px;letter-spacing:.15em;transform:rotate(-3deg)}
.realbox .res{opacity:.85}
.src{font-size:13px;opacity:.7}
.over a{color:inherit}
.hurt{font-family:var(--f-display);font-weight:900;font-size:19px;margin:0}
.small{font-size:13.5px;opacity:.75;margin:10px 0 0;line-height:1.7}
.skiplist{margin:10px 0 0;padding-left:1.4em;font-family:var(--f-hand);font-size:17px;line-height:1.8}
.flow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;font-size:11px;white-space:nowrap}
.flow::-webkit-scrollbar{display:none}
.flow span{padding:1px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.22);opacity:.6}
.flow span.done{opacity:.35;text-decoration:line-through}
.flow span.now{opacity:1;background:var(--chalk);color:#1d2725;border-color:var(--chalk);font-weight:700}
#banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.96);text-align:center;color:#fff;background:rgba(20,26,23,.86);padding:14px 26px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .35s,transform .35s;max-width:calc(100% - 32px)}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner b{display:block;font-family:var(--f-display);font-size:30px;letter-spacing:.08em;color:var(--chalk)}
#banner span{display:block;font-size:15px;margin-top:4px}
.flowline{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.8}
.sbtns{display:flex;gap:6px}
.sbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--board-ink);border-radius:4px;padding:2px 8px;font-size:11.5px}
.speak{margin-left:auto;background:transparent;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:1px 10px;font-size:12px}
.realbox .speak{border-color:currentColor;color:inherit;margin-left:10px;vertical-align:middle;opacity:.8}
/* Over */
.over{position:fixed;inset:0;z-index:20;overflow-y:auto;background:#0d0f0e;color:#e9ece8;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.over.win{background:var(--paper);color:var(--ink)}
.over .wrap{padding-block:40px 60px}
.big{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,12vw,64px);letter-spacing:.12em;line-height:1.1}
.over:not(.win) .big{color:#ff4b3e;animation:fadein 1.2s ease both}
@keyframes fadein{from{opacity:0;letter-spacing:.5em}to{opacity:1}}
.crimes{margin:18px 0 0;padding-left:1.6em;font-family:var(--f-hand);font-size:18px;line-height:1.75}
.crimes li.pad{opacity:.65}
.sect{margin-top:28px;border-top:1px solid rgba(255,255,255,.18);padding-top:16px}
.over.win .sect{border-top-color:var(--rule)}
.sect h3{font-size:13px;letter-spacing:.2em;opacity:.7;font-weight:500}
.report{display:grid;grid-template-columns:7em 1fr;gap:6px 12px;margin-top:10px;font-size:14px}
.report dt{opacity:.65}
.report dd{margin:0;min-width:0}
.idx{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.idx div{font-size:12px;opacity:.75}
.idx b{display:block;font-family:var(--f-display);font-size:28px;opacity:1;font-variant-numeric:tabular-nums}
.ledger{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px;font-family:var(--f-hand);font-size:17px}
.ledger li{display:grid;grid-template-columns:3.4em 1fr;gap:8px}
.ledger time{font-family:var(--f-ui);font-size:12px;opacity:.6;padding-top:4px;font-variant-numeric:tabular-nums}
.tribute{font-family:var(--f-hand);font-size:19px;line-height:1.9;margin-top:12px;max-width:34em}
.tribute p{margin:0 0 10px}
.over .row .ghost{border-color:currentColor}
.ending-name{font-family:var(--f-display);font-weight:900;font-size:24px;color:var(--red);margin-top:6px}
.fade-in{animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

/* ============ 聲音與配音 ============ */
const AU=(()=>{
  let ctx=null,master=null,music=null,sfx=null,timer=null,step=0,nextT=0,tempo=132,ducked=false,on=true;
  try{on=localStorage.getItem('pinan_snd')!=='0'}catch(e){}
  const mf=m=>440*Math.pow(2,(m-69)/12);
  // 原創 8 小節旋律（八分音符；0 = 休止）
  const MEL=[72,76,79,76,74,72,74,76, 77,76,74,72,71,72,74,0, 72,76,79,81,79,77,76,74, 72,74,76,74,72,0,67,0,
             69,72,76,72,74,77,76,74, 72,71,69,71,72,0,74,76, 77,79,81,79,77,76,74,72, 71,72,74,71,72,0,0,0];
  const BASS=[48,45,41,43,45,41,43,48];
  function init(){
    if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();
      master=ctx.createGain();master.gain.value=on?1:0;master.connect(ctx.destination);
      music=ctx.createGain();music.gain.value=.5;music.connect(master);sfx=ctx.createGain();sfx.gain.value=.9;sfx.connect(master)}
    if(ctx.state==='suspended')ctx.resume();
  }
  function tone(f,t,d,type,vol,dest,att){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(dest||sfx);o.start(t);o.stop(t+d+.05);return o}
  function noise(t,d,vol,f1,f2,q){const len=Math.floor(ctx.sampleRate*d),b=ctx.createBuffer(1,len,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;
    const s=ctx.createBufferSource();s.buffer=b;const fl=ctx.createBiquadFilter();fl.type='bandpass';fl.Q.value=q||1;fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(sfx);s.start(t);s.stop(t+d)}
  function sched(){if(!ctx)return;const e=60/tempo/2;
    while(nextT<ctx.currentTime+.15){const i=step%MEL.length,m=MEL[i];
      if(m)tone(mf(m),nextT,e*.9,'square',.05,music);
      if(i%2===0){const bm=BASS[Math.floor(i/8)%BASS.length]+(i%4===2?7:0);tone(mf(bm),nextT,e*1.8,'triangle',.12,music)}
      if(i%4===2)noise(nextT,.05,.05,6000,8000,2);
      nextT+=e;step++}}
  function bgmStart(){if(!ctx)return;bgmStop();step=0;nextT=ctx.currentTime+.6;timer=setInterval(sched,30)}
  function bgmStop(){if(timer){clearInterval(timer);timer=null}}
  function setTempo(v){tempo=v}
  function duck(v){if(!ctx||ducked===v)return;ducked=v;music.gain.setTargetAtTime(v?.18:.5,ctx.currentTime,.15)}
  function bell(){if(!ctx)return;const N=[68,66,64,59, 64,68,66,59],t0=ctx.currentTime+.05;
    N.forEach((m,i)=>{const t=t0+i*.5+(i>=4?.35:0),f=mf(m);tone(f,t,1.6,'sine',.18,sfx,.005);tone(f*2.01,t,.8,'sine',.05,sfx,.005);tone(f*3.02,t,.4,'sine',.025,sfx,.005)})}
  function whoosh(){if(!ctx)return;noise(ctx.currentTime,.45,.35,400,2400,1.5)}
  function stamp(){if(!ctx)return;const t=ctx.currentTime;noise(t,.12,.6,1200,300,.7);const o=tone(120,t,.35,'sine',.5);o.frequency.exponentialRampToValueAtTime(45,t+.3)}
  function click(){if(!ctx)return;noise(ctx.currentTime,.06,.15,2500,1500,3)}
  function doom(){if(!ctx)return;const t=ctx.currentTime+.1;tone(55,t,3.2,'sawtooth',.12,sfx,.3);tone(58.3,t,3.2,'sawtooth',.08,sfx,.3);tone(110,t+.05,1.2,'sine',.15)}
  function fanfare(){if(!ctx)return;const t=ctx.currentTime+.05;[72,76,79,84].forEach((m,i)=>tone(mf(m),t+i*.13,i===3?.9:.25,'square',.08));tone(mf(60),t+.39,.9,'triangle',.15)}
  function setOn(v){on=v;try{localStorage.setItem('pinan_snd',v?'1':'0')}catch(e){}if(master&&ctx)master.gain.setTargetAtTime(v?1:0,ctx.currentTime,.05)}
  function pause(v){if(!ctx)return;v?ctx.suspend():ctx.resume()}
  return {init,bgmStart,bgmStop,setTempo,duck,bell,whoosh,stamp,click,doom,fanfare,setOn,pause,get on(){return on}};
})();
const VO=(()=>{
  const ok=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
  let voice=null,auto=false;
  try{auto=localStorage.getItem('pinan_vo')==='1'}catch(e){}
  function pickVoice(){if(!ok)return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh/i.test(v.lang))||null}
  if(ok){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}}
  function speak(text){if(!ok)return false;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=voice?voice.lang:'zh-TW';if(voice)u.voice=voice;u.rate=1.05;speechSynthesis.speak(u);return true}catch(e){return false}}
  function stop(){if(ok)try{speechSynthesis.cancel()}catch(e){}}
  function setAuto(v){auto=v;try{localStorage.setItem('pinan_vo',v?'1':'0')}catch(e){}if(!v)stop()}
  return {ok,speak,stop,setAuto,get auto(){return auto}};
})();

let grid=[];
function fillG(x,y,w,h,v){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)grid[j][i]=v}
function buildWorld(){
  grid=Array.from({length:MH},()=>Array(MW).fill(0));
  for(let x=0;x<MW;x++){grid[0][x]=1;grid[MH-1][x]=1}
  for(let y=0;y<MH;y++){grid[y][0]=1;grid[y][MW-1]=1}
  fillG(21,9,16,18,2);fillG(1,22,9,5,2);
  ROOMS.forEach(r=>{fillG(r.x,r.y,r.w,r.h,1);grid[r.dy][r.dx]=3});
  TREES.forEach(([x,y])=>grid[y][x]=4);
  grid[MH-1][18]=5;grid[MH-1][19]=5;
}
function walkable(x,y){const tx=Math.floor(x),ty=Math.floor(y);if(tx<0||ty<0||tx>=MW||ty>=MH)return false;const c=grid[ty][tx];if(c===5)return exitOpen();return c===0||c===2}
function blocked(x,y,r){return !walkable(x-r,y-r)||!walkable(x+r,y-r)||!walkable(x-r,y+r)||!walkable(x+r,y+r)}
function moveEnt(e,dx,dy,r){const ox=e.x,oy=e.y;if(!blocked(e.x+dx,e.y,r))e.x+=dx;if(!blocked(e.x,e.y+dy,r))e.y+=dy;return Math.hypot(e.x-ox,e.y-oy)}
function randTile(near,rad){for(let k=0;k<60;k++){const x=near?clamp(Math.floor(near.x)+rint(-rad,rad),1,MW-2):rint(1,MW-2);const y=near?clamp(Math.floor(near.y)+rint(-rad,rad),1,MH-2):rint(1,MH-2);const c=grid[y][x];if(c===0||c===2)return {x:x+.5,y:y+.5}}return {x:19,y:7}}

function updNPC(n,dt){
  if(n.type==='parent'){n.life-=dt;
    if(n.life<=0||n.cool>0){n.tgt={x:19,y:26.6};if(Math.hypot(n.x-19,n.y-26.6)<.6){n.gone=true;return}}
    else if(n.detour<=0)n.tgt={x:P.x,y:P.y}}
  else if(!n.tgt||Math.hypot(n.tgt.x-n.x,n.tgt.y-n.y)<.3)n.tgt=randTile(n,7);
  if(n.detour>0)n.detour-=dt;
  const dx=n.tgt.x-n.x,dy=n.tgt.y-n.y,L=Math.hypot(dx,dy)||1,s=n.spd*dt;
  const m=moveEnt(n,dx/L*s,dy/L*s,.28);n.walk=(n.walk||0)+m*3;n.fx=dx/L;n.fy=dy/L;
  if(m<s*.3){n.stuck+=dt;if(n.stuck>.5){n.tgt=randTile(n,4);n.detour=1.4;n.stuck=0}}else n.stuck=0;
  if(n.type==='student'&&n.cool>0)n.cool-=dt;
}

function update(dt){
  let ix=0,iy=0;
  if(keys.ArrowLeft||keys.a)ix-=1;if(keys.ArrowRight||keys.d)ix+=1;if(keys.ArrowUp||keys.w)iy-=1;if(keys.ArrowDown||keys.s)iy+=1;
  if(joy){const jx=(joy.x-joy.ox)/42,jy=(joy.y-joy.oy)/42,L=Math.hypot(jx,jy);if(L>.15){ix=jx/Math.max(1,L);iy=jy/Math.max(1,L)}}
  const L=Math.hypot(ix,iy);P.moving=L>.1;
  if(P.moving){const nx=ix/Math.max(1,L),ny=iy/Math.max(1,L),h=Math.hypot(nx,ny)||1;P.fx=nx/h;P.fy=ny/h;walkT+=moveEnt(P,nx*4.3*dt,ny*4.3*dt,.3);
    if(!hintShown){hintShown=1;$('ctlhint').style.opacity=0}}
  NPCS.forEach(n=>updNPC(n,dt));NPCS=NPCS.filter(n=>!n.gone);
  const ph=PHASES[S.ph];S.phT+=dt;
  const nt=Math.min(ph.end,ph.t+Math.floor(S.phT/phaseLimit()*(ph.end-ph.t)));if(nt!==S.t){S.t=nt;hud()}
  // 投訴單
  S.paperT-=dt;if(S.paperT<=0){S.paperT=rint(12,20);spawnPaper()}
  for(let i=S.papers.length-1;i>=0;i--){const p=S.papers[i];if(p.wait>0){p.wait-=dt;if(p.wait<=0){const dx=P.x-p.x,dy=P.y-p.y,L=Math.hypot(dx,dy)||1;p.vx=dx/L*8;p.vy=dy/L*8}continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.rot+=dt*8;
    if(Math.hypot(p.x-P.x,p.y-P.y)<.55){S.papers.splice(i,1);return sendToMeeting(ANON,'被一張匿名檢舉打中')}
    if(p.life<=0||p.x<0||p.y<0||p.x>MW||p.y>MH)S.papers.splice(i,1)}
  grace-=dt;if(grace>0)return;
  // 下課時間到
  if(ph.free&&S.phT>=ph.free){toast('上課鐘響。');return nextPhase()}
  // 被叫住
  for(const n of NPCS){if(n.cool>0)continue;if(Math.hypot(n.x-P.x,n.y-P.y)<.72){
    n.cool=n.type==='parent'?1:12;if(n.type==='student')n.tgt=randTile(n,8);
    return openCase(drawCard('B'),n.type==='parent'?'走廊上・被家長攔住':'走廊上・被學生叫住',()=>{})}}
  // 下課時，辦公室和行政處室有事
  if(ph.free){for(const id of ['off','adm']){const r=roomById(id);if(Math.hypot(P.x-(r.dx+.5),P.y-(r.dy+.5))<1.05&&!(S.doorCool[id]>S.phT)){S.doorCool[id]=S.phT+8;
      return openCase(drawCard('B'),r.n,()=>{pushOut(r)})}}return}
  // 走到目的地
  if(!S.arrived&&atDest())return arrive();
  if(!S.arrived&&!S.late&&S.phT>=ph.lim&&S.dest!=='exit'){S.late=true;
    return openCase(LATE,`${fmt(S.t)}・還在路上`,()=>{const d=destPoint();P.x=d.x;P.y=d.y+(S.dest==='fld'?0:(roomById(S.dest)||{out:1}).out*1.3);arrive()})}
}

  g.fillStyle='#f3f0e5';g.font='700 11px "Noto Sans TC",sans-serif';g.textAlign='center';g.fillText('校門',19*TS,(MH-1)*TS-10);
  TREES.forEach(([x,y])=>{const cx=x*TS+TS/2,cy=y*TS+TS/2;g.fillStyle='rgba(0,0,0,.22)';g.beginPath();g.ellipse(cx+3,cy+10,13,6,0,0,7);g.fill();
    g.fillStyle='#3f7a46';g.beginPath();g.arc(cx,cy,14,0,7);g.fill();g.fillStyle='#4f9455';g.beginPath();g.arc(cx-4,cy-4,9,0,7);g.fill()});
  ROOMS.forEach(r=>{const x=r.x*TS,y=r.y*TS,w=r.w*TS,h=r.h*TS;
    g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x+4,y+6,w,h);g.fillStyle=r.c;g.fillRect(x,y,w,h);
    g.strokeStyle='rgba(40,30,20,.55)';g.lineWidth=2;g.strokeRect(x+1,y+1,w-2,h-2);
    g.strokeStyle='rgba(0,0,0,.08)';g.lineWidth=1;for(let yy=y+8;yy<y+h;yy+=8){g.beginPath();g.moveTo(x+2,yy);g.lineTo(x+w-2,yy);g.stroke()}
    const wy=r.out>0?y+h-12:y+4;g.fillStyle='#bfe0ef';for(let xx=x+8;xx<x+w-14;xx+=22){if(Math.abs(xx+6-(r.dx*TS+TS/2))<18)continue;g.fillRect(xx,wy,12,8)}
    const dx=r.dx*TS,dy=r.dy*TS;g.fillStyle='#7a4e2c';g.fillRect(dx+5,dy+(r.out>0?8:0),TS-10,TS-8);g.fillStyle='#e8c35a';g.fillRect(dx+TS-11,dy+16,3,3);
    g.font='700 13px "Noto Sans TC",sans-serif';const tw=g.measureText(r.n).width,sx=x+w/2,sy=r.h>2?y+h/2:y+h-12,bw=Math.max(tw,28)+14;
    g.fillStyle='rgba(251,252,248,.92)';g.fillRect(sx-bw/2,sy-11,bw,22);g.strokeStyle='#1d2725';g.lineWidth=1.5;g.strokeRect(sx-bw/2,sy-11,bw,22);
    g.fillStyle='#1d2725';g.textAlign='center';g.textBaseline='middle';g.fillText(r.n,sx,sy)});
  staticCv=c;
}
function drawPerson(g,x,y,o){
  const bob=o.moving?Math.sin(o.walk*2.2)*1.6:0;
  g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x,y+11,9,4,0,0,7);g.fill();
  g.fillStyle=o.pants;const lp=o.moving?Math.sin(o.walk*2.2)*3:0;g.fillRect(x-5,y+3+bob,4,8+lp*.3);g.fillRect(x+1,y+3+bob,4,8-lp*.3);
  g.fillStyle=o.shirt;g.fillRect(x-7,y-6+bob,14,11);
  if(o.bag){g.fillStyle=o.bag;g.fillRect(x-8,y-5+bob,4,9)}
  if(o.lanyard){g.strokeStyle='#c3352b';g.lineWidth=1.5;g.beginPath();g.moveTo(x-4,y-6+bob);g.lineTo(x,y+1+bob);g.lineTo(x+4,y-6+bob);g.stroke();g.fillStyle='#fff';g.fillRect(x-2,y+bob,4,4)}
  g.fillStyle='#f0c9a2';g.beginPath();g.arc(x,y-12+bob,7,0,7);g.fill();
  g.fillStyle=o.hair;g.beginPath();g.arc(x,y-14+bob,7,Math.PI,0);g.fill();
  if(o.fy>=0){g.fillStyle='#222';g.fillRect(x-3+o.fx*2,y-12+bob,2,2);g.fillRect(x+2+o.fx*2,y-12+bob,2,2)}
  if(o.label){g.font='700 10px "Noto Sans TC",sans-serif';g.textAlign='center';const tw=g.measureText(o.label).width+8;g.fillStyle=o.labelBg||'rgba(29,39,37,.85)';g.fillRect(x-tw/2,y-34+bob,tw,14);g.fillStyle='#fff';g.textBaseline='middle';g.fillText(o.label,x,y-27+bob)}
  if(o.bang){g.fillStyle='#ffd23f';g.strokeStyle='#1d2725';g.lineWidth=1.5;g.beginPath();g.arc(x+11,y-24+bob,7,0,7);g.fill();g.stroke();g.fillStyle='#1d2725';g.font='900 11px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('!',x+11,y-23.5+bob)}
}

function draw(){
  const cv=$('cv');if(!cv)return;const g=cv.getContext('2d');
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#33402f';g.fillRect(0,0,cv.width,cv.height);
  if(!staticCv||!S||!P||S.ph<0)return;
  const vw=cvW/zoom,vh=cvH/zoom,WW=MW*TS,WH=MH*TS;
  let tx=P.x*TS-vw/2,ty=P.y*TS-vh/2;tx=vw>=WW?(WW-vw)/2:clamp(tx,0,WW-vw);ty=vh>=WH?(WH-vh)/2:clamp(ty,0,WH-vh);
  camX+=(tx-camX)*.2;camY+=(ty-camY)*.2;if(Math.abs(tx-camX)>200)camX=tx;if(Math.abs(ty-camY)>200)camY=ty;
  g.setTransform(dpr*zoom,0,0,dpr*zoom,-camX*dpr*zoom,-camY*dpr*zoom);
  g.drawImage(staticCv,0,0,WW,WH);
  const now=performance.now()/1000,pulse=.55+.45*Math.sin(now*5);
  // 目的地
  if(S.dest&&!S.arrived){
    g.strokeStyle=`rgba(255,214,90,${pulse})`;g.lineWidth=4;
    if(S.dest==='fld'){g.setLineDash([10,8]);g.strokeRect(FIELD.x*TS,FIELD.y*TS,FIELD.w*TS,FIELD.h*TS);g.setLineDash([])}
    else if(S.dest!=='exit'){const r=roomById(S.dest);g.strokeRect(r.dx*TS+2,r.dy*TS+(r.out>0?4:-4),TS-4,TS);
      g.fillStyle='#ffd23f';g.beginPath();const bx=r.dx*TS+TS/2,by=r.dy*TS+(r.out>0?TS+18:-16)+Math.sin(now*6)*3;g.moveTo(bx,by-(r.out>0?-10:10));g.lineTo(bx-8,by);g.lineTo(bx+8,by);g.closePath();g.fill()}}
  // 下課時可進入的門
  if(PHASES[S.ph].free)['off','adm'].forEach(id=>{const r=roomById(id);g.strokeStyle=`rgba(195,53,43,${pulse})`;g.lineWidth=2;g.strokeRect(r.dx*TS+3,r.dy*TS-2,TS-6,TS-4)});
  if(exitOpen()){g.fillStyle=`rgba(255,214,90,${.45+.35*Math.sin(now*5)})`;g.fillRect(18*TS,(MH-1)*TS,2*TS,TS);
    g.fillStyle='#1d2725';g.font='900 12px "Noto Sans TC",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('打卡下班',19*TS,(MH-1)*TS+TS/2)}
  else{g.strokeStyle='#3d4a40';g.lineWidth=3;for(let i=0;i<8;i++){const xx=18*TS+4+i*8;g.beginPath();g.moveTo(xx,(MH-1)*TS+2);g.lineTo(xx,MH*TS-2);g.stroke()}}
  const ents=NPCS.map(n=>({n,y:n.y})).concat([{n:null,y:P.y}]).sort((a,b)=>a.y-b.y);
  ents.forEach(e=>{
    if(!e.n){drawPerson(g,P.x*TS,P.y*TS,{moving:P.moving,walk:walkT*2,shirt:'#2b4b9b',pants:'#2d2d33',hair:'#2a211c',lanyard:1,fx:P.fx,fy:P.fy,label:'你',labelBg:'#c3352b'});return}
    const n=e.n;
    if(n.type==='student')drawPerson(g,n.x*TS,n.y*TS,{moving:1,walk:n.walk||0,shirt:'#f4f4f0',pants:'#24335c',hair:'#1b1b1b',bag:n.bag,fx:n.fx||0,fy:n.fy||1});
    else drawPerson(g,n.x*TS,n.y*TS,{moving:1,walk:n.walk||0,shirt:'#7b4fa3',pants:'#3b3340',hair:'#3b2a20',fx:n.fx||0,fy:n.fy||1,label:'家長',labelBg:'#7b4fa3',bang:!n.cool&&n.life>0});
  });
  (S.papers||[]).forEach(p=>{const x=p.x*TS,y=p.y*TS-8;if(p.wait>0){g.strokeStyle='rgba(255,59,48,.9)';g.lineWidth=3;g.beginPath();g.arc(x,y,14+p.wait*30,0,7);g.stroke();g.strokeStyle='rgba(255,59,48,.35)';g.setLineDash([6,6]);g.beginPath();g.moveTo(x,y);g.lineTo(P.x*TS,P.y*TS-8);g.stroke();g.setLineDash([])}g.save();g.translate(x,y);g.rotate(p.rot);g.fillStyle='#fffdf5';g.strokeStyle='#1d2725';g.lineWidth=1.2;g.fillRect(-9,-11,18,22);g.strokeRect(-9,-11,18,22);
    g.fillStyle='#c3352b';g.fillRect(-6,-7,12,3);g.fillStyle='#aaa';g.fillRect(-6,-1,12,1.5);g.fillRect(-6,3,9,1.5);g.restore();
    g.font='700 10px "Noto Sans TC",sans-serif';g.textAlign='center';g.textBaseline='middle';const tw=g.measureText('匿名檢舉').width+8;g.fillStyle='#c3352b';g.fillRect(x-tw/2,y-26,tw,13);g.fillStyle='#fff';g.fillText('匿名檢舉',x,y-19.5)});
  g.setTransform(dpr,0,0,dpr,0,0);
  if(S.t>=930){g.fillStyle=`rgba(255,130,50,${Math.min(.22,(S.t-930)/90*.22)})`;g.fillRect(0,0,cvW,cvH)}
  // 指向目的地
  if(S.dest&&!S.arrived){const d=destPoint(),gx=(d.x*TS-camX)*zoom,gy=(d.y*TS-camY)*zoom;
    if(gx<0||gx>cvW||gy<0||gy>cvH){const px=(P.x*TS-camX)*zoom,py=(P.y*TS-camY)*zoom,a=Math.atan2(gy-py,gx-px);
      const ax=clamp(px+Math.cos(a)*Math.min(cvW,cvH)*.38,26,cvW-26),ay=clamp(py+Math.sin(a)*Math.min(cvW,cvH)*.38,26,cvH-26);
      g.save();g.translate(ax,ay);g.rotate(a);g.fillStyle='#ffd23f';g.strokeStyle='#1d2725';g.lineWidth=2;g.beginPath();g.moveTo(18,0);g.lineTo(-11,-12);g.lineTo(-5,0);g.lineTo(-11,12);g.closePath();g.fill();g.stroke();g.restore()}}
  // 小地圖
  const ms=Math.min(3,Math.max(2,cvW/150)),mw=MW*ms,mh=MH*ms,mx=cvW-mw-8,my=8;
  g.fillStyle='rgba(20,26,23,.72)';g.fillRect(mx-3,my-3,mw+6,mh+6);
  g.fillStyle='#6f9a55';g.fillRect(mx+21*ms,my+9*ms,16*ms,18*ms);g.fillRect(mx+ms,my+22*ms,9*ms,5*ms);
  ROOMS.forEach(r=>{g.fillStyle=(S.dest===r.id&&!S.arrived)?(pulse>.5?'#ffd23f':r.c):r.c;g.fillRect(mx+r.x*ms,my+r.y*ms,r.w*ms,r.h*ms)});
  if(S.dest==='fld'&&!S.arrived&&pulse>.5){g.strokeStyle='#ffd23f';g.lineWidth=2;g.strokeRect(mx+FIELD.x*ms,my+FIELD.y*ms,FIELD.w*ms,FIELD.h*ms)}
  if(exitOpen()){g.fillStyle='#ffd23f';g.fillRect(mx+18*ms,my+(MH-1)*ms,2*ms,ms)}
  (S.papers||[]).forEach(p=>{g.fillStyle='#ff3b30';g.fillRect(mx+p.x*ms-2,my+p.y*ms-2,4,4)});
  NPCS.forEach(n=>{g.fillStyle=n.type==='parent'?'#c38bff':'#fff';g.fillRect(mx+n.x*ms-1.5,my+n.y*ms-1.5,3,3)});
  g.fillStyle='#ffd23f';g.beginPath();g.arc(mx+P.x*ms,my+P.y*ms,3,0,7);g.fill();
  if(joy){g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=2;g.beginPath();g.arc(joy.ox,joy.oy,42,0,7);g.stroke();
    const jx=joy.x-joy.ox,jy=joy.y-joy.oy,L=Math.hypot(jx,jy),k=L>42?42/L:1;g.fillStyle='rgba(255,255,255,.65)';g.beginPath();g.arc(joy.ox+jx*k,joy.oy+jy*k,16,0,7);g.fill()}
}

function frame(ts){if(!running)return;const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(!paused)update(dt);draw();if(running)frameId=requestAnimationFrame(frame)}
function bindInput(){
  const cv=$('cv');
  cv.tabIndex=0;cv.addEventListener('pointerdown',e=>{if(paused||joy)return;cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect();joy={id:e.pointerId,ox:e.clientX-r.left,oy:e.clientY-r.top,x:e.clientX-r.left,y:e.clientY-r.top}});
  cv.addEventListener('pointermove',e=>{if(!joy||e.pointerId!==joy.id)return;const r=cv.getBoundingClientRect();joy.x=e.clientX-r.left;joy.y=e.clientY-r.top});
  const end=e=>{if(joy&&e.pointerId===joy.id)joy=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  const K={ArrowLeft:1,ArrowRight:1,ArrowUp:1,ArrowDown:1,a:1,d:1,w:1,s:1,A:1,D:1,W:1,S:1};
  addEventListener('keydown',e=>{if($('game').hidden)return;if(K[e.key]){if(!$('modal').hidden)return;keys[e.key.length===1?e.key.toLowerCase():e.key]=true;e.preventDefault()}
    if((e.key.toLowerCase()==='p'||e.key==='Escape')&&!e.repeat){e.preventDefault();setUserPause(!userPaused)}});
  addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
  addEventListener('blur',()=>{keys={};joy=null});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&!$('game').hidden)setUserPause(true)});
  $('pauseBtn').onclick=()=>setUserPause(!userPaused);
  $('resumeBtn').onclick=()=>setUserPause(false);
  $('homeBtn').onclick=()=>{if(confirm('回到首頁會結束目前這一天，確定離開？')){setUserPause(false);renderStart()}};
  $('mobilePad').querySelectorAll('button').forEach(button=>{const dir=button.dataset.dir;button.addEventListener('pointerdown',e=>{if(paused)return;e.preventDefault();button.setPointerCapture(e.pointerId);keys[dir]=true;button.classList.add('held')});const end=()=>{keys[dir]=false;button.classList.remove('held')};['pointerup','pointercancel','lostpointercapture'].forEach(type=>button.addEventListener(type,end))});
  addEventListener('keydown',e=>{if($('game').hidden||e.repeat)return;const root=!$('pauseMsg').hidden?$('pauseMsg'):!$('modal').hidden?$('modal'):null;if(!root)return;
    if(e.key==='Tab'){const nodes=[...root.querySelectorAll('button:not([disabled]),a[href]')].filter(n=>n.getClientRects().length);if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&(document.activeElement===first||!nodes.includes(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||!nodes.includes(document.activeElement))){e.preventDefault();first.focus()}}
    if(root===$('modal')){if(/^[1-4]$/.test(e.key)){const button=root.querySelectorAll('.card')[Number(e.key)-1];if(button&&!button.disabled){e.preventDefault();button.click()}}else if(e.key==='Enter'&&document.activeElement?.tagName!=='BUTTON'){const next=$('next');if(next){e.preventDefault();next.click()}}}
  });
  $('sndBtn').onclick=()=>{AU.init();AU.setOn(!AU.on);syncAudioBtns()};
  $('voBtn').onclick=()=>{VO.setAuto(!VO.auto);syncAudioBtns()};
  syncAudioBtns();
  if(window.ResizeObserver)new ResizeObserver(resize).observe($('stage'));else addEventListener('resize',resize);
}
function getRecord(){try{const r=JSON.parse(localStorage.getItem('pinan_record')||'{}');return {runs:Math.max(0,Number(r.runs)||0),wins:Math.max(0,Number(r.wins)||0),bestDay:Math.max(0,Number(r.bestDay)||0)}}catch{return {runs:0,wins:0,bestDay:0}}}
function saveRecord(record){try{localStorage.setItem('pinan_record',JSON.stringify(record))}catch{}}
try{const theme=localStorage.getItem('pinan_theme');if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme}catch{}
if(typeof document!=='undefined'&&document.getElementById('main')){
  buildWorld();buildStatic();bindInput();renderStart();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>buildStatic());
}

</script>
