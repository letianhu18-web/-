<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <!-- The actual resolution of the NES is 256x240.
         Ideally, we draw in this size and scale appropriately.-->
    <title>超级马里奥 · 真人主角版</title>
    <meta name="description" content="经典平台游戏，主角换成照片中的真人头像。">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23152540%22/%3E%3Cpath d=%22M6 17a10 10 0 0 1 20 0H6Z%22 fill=%22%23e24738%22/%3E%3Cpath d=%22M9 17h14v6a3 3 0 0 1-3 3h-8a3 3 0 0 1-3-3z%22 fill=%22%23f3deaf%22/%3E%3Ccircle cx=%2213%22 cy=%2212%22 r=%222%22 fill=%22%23fff7df%22/%3E%3Ccircle cx=%2219%22 cy=%2212%22 r=%222%22 fill=%22%23fff7df%22/%3E%3C/svg%3E">

    <link rel="stylesheet" href="css/game.css?v=9">
  </head>
  <body>
    <div class="startup-status" id="startup-status" role="status" aria-live="polite">
      <span id="startup-message">正在加载游戏素材…</span>
      <button id="startup-retry" type="button" hidden>重试</button>
    </div>
    <script type="text/javascript" src="js/util.js?v=7"></script>
    <script type="text/javascript" src="js/input.js?v=9"></script>
    <script type="text/javascript" src="js/resources.js?v=7"></script>
    <script type="text/javascript" src="js/sprite.js?v=7"></script>
    <script type="text/javascript" src="js/entity.js?v=7"></script>
    <script type="text/javascript" src="js/pipe.js?v=7"></script>
    <script type="text/javascript" src="js/mushroom.js?v=7"></script>
    <script type="text/javascript" src="js/fireflower.js?v=7"></script>
    <script type="text/javascript" src="js/star.js?v=7"></script>
    <script type="text/javascript" src="js/fireball.js?v=7"></script>
    <script type="text/javascript" src="js/coin.js?v=7"></script>
    <script type="text/javascript" src="js/bcoin.js?v=7"></script>
    <script type="text/javascript" src="js/goomba.js?v=7"></script>
    <script type="text/javascript" src="js/koopa.js?v=7"></script>
    <script type="text/javascript" src="js/floor.js?v=7"></script>
    <script type="text/javascript" src="js/block.js?v=7"></script>
    <script type="text/javascript" src="js/rubble.js?v=7"></script>
    <script type="text/javascript" src="js/prop.js?v=7"></script>
    <script type="text/javascript" src="js/player.js?v=9"></script>
    <script type="text/javascript" src="js/flag.js?v=7"></script>
    <script type="text/javascript" src="js/levels/level.js?v=7"></script>
    <script type="text/javascript" src="js/levels/11.js?v=7"></script>
    <script type="text/javascript" src="js/levels/11tunnel.js?v=7"></script>
    <script type="text/javascript" src="js/levels/campaign.js?v=9"></script>
    <script type="text/javascript" src="js/game.js?v=9"></script>
    <div class="info">
      <p class="controls">←→移动　↓下蹲 / 进管道　长按 ↑ / A 跳更高　Z / B 奔跑 / 火球</p>
      <label class="stage-picker" for="stage-select">关卡
        <select id="stage-select" aria-label="选择关卡">
          <option value="0">1-1 草原启程</option>
          <option value="1">1-2 地下通道</option>
          <option value="2">2-1 云端跳跃</option>
          <option value="3">2-2 城堡阶梯</option>
        </select>
      </label>
      <div class="links">游戏源码：<a href="https://github.com/reruns/mario">GitHub / reruns / mario</a></div>
    </div>
    <div class="stage-toast" id="stage-toast" role="status" aria-live="polite"></div>
    <section class="touch-controls" aria-label="屏幕触控游戏按键">
      <div class="touch-pad">
        <button class="touch-button up" type="button" data-game-key="UP" aria-label="跳跃">▲</button>
        <button class="touch-button left" type="button" data-game-key="LEFT" aria-label="向左移动">◀</button>
        <button class="touch-button down" type="button" data-game-key="DOWN" aria-label="下蹲或进管道">▼</button>
        <button class="touch-button right" type="button" data-game-key="RIGHT" aria-label="向右移动">▶</button>
      </div>
      <div class="touch-actions" aria-label="动作键">
        <button class="touch-button action-run" type="button" data-game-key="RUN" aria-label="按住奔跑；火焰形态下发射火球">B</button>
        <button class="touch-button action-jump" type="button" data-game-key="JUMP" aria-label="长按跳得更高">A</button>
      </div>
      <p class="touch-hint" id="touch-hint">左侧方向键　右侧 A 长按跳更高，B 奔跑 / 发射火球</p>
    </section>
  </body>
</html>
