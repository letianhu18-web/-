<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <!-- The actual resolution of the NES is 256x240.
         Ideally, we draw in this size and scale appropriately.-->
    <title>超级马里奥 · 真人主角版</title>
    <meta name="description" content="经典平台游戏，主角换成照片中的真人头像。">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23152540%22/%3E%3Cpath d=%22M6 17a10 10 0 0 1 20 0H6Z%22 fill=%22%23e24738%22/%3E%3Cpath d=%22M9 17h14v6a3 3 0 0 1-3 3h-8a3 3 0 0 1-3-3z%22 fill=%22%23f3deaf%22/%3E%3Ccircle cx=%2213%22 cy=%2212%22 r=%222%22 fill=%22%23fff7df%22/%3E%3Ccircle cx=%2219%22 cy=%2212%22 r=%222%22 fill=%22%23fff7df%22/%3E%3C/svg%3E">

    <link rel="stylesheet" href="css/game.css">
  </head>
  <body>
    <div class="startup-status" id="startup-status" role="status" aria-live="polite">
      <span id="startup-message">正在加载游戏素材…</span>
      <button id="startup-retry" type="button" hidden>重试</button>
    </div>
    <script type="text/javascript" src="js/util.js"></script>
    <script type="text/javascript" src="js/input.js"></script>
    <script type="text/javascript" src="js/resources.js"></script>
    <script type="text/javascript" src="js/sprite.js"></script>
    <script type="text/javascript" src="js/entity.js"></script>
    <script type="text/javascript" src="js/pipe.js"></script>
    <script type="text/javascript" src="js/mushroom.js"></script>
    <script type="text/javascript" src="js/fireflower.js"></script>
    <script type="text/javascript" src="js/star.js"></script>
    <script type="text/javascript" src="js/fireball.js"></script>
    <script type="text/javascript" src="js/coin.js"></script>
    <script type="text/javascript" src="js/bcoin.js"></script>
    <script type="text/javascript" src="js/goomba.js"></script>
    <script type="text/javascript" src="js/koopa.js"></script>
    <script type="text/javascript" src="js/floor.js"></script>
    <script type="text/javascript" src="js/block.js"></script>
    <script type="text/javascript" src="js/rubble.js"></script>
    <script type="text/javascript" src="js/prop.js"></script>
    <script type="text/javascript" src="js/player.js"></script>
    <script type="text/javascript" src="js/flag.js"></script>
    <script type="text/javascript" src="js/levels/level.js"></script>
    <script type="text/javascript" src="js/levels/11.js"></script>
    <script type="text/javascript" src="js/levels/11tunnel.js"></script>
    <script type="text/javascript" src="js/game.js"></script>
    <div class="info">
      <p class="controls">方向键：←→移动　↑跳跃　↓下蹲 / 进管道　Z / B：奔跑 / 火球</p>
      <div class="links">游戏源码：<a href="https://github.com/reruns/mario">GitHub / reruns / mario</a></div>
    </div>
    <section class="touch-controls" aria-label="屏幕触控方向键">
      <div class="touch-pad">
        <button class="touch-button up" type="button" data-game-key="UP" aria-label="跳跃">▲</button>
        <button class="touch-button left" type="button" data-game-key="LEFT" aria-label="向左移动">◀</button>
        <button class="touch-button down" type="button" data-game-key="DOWN" aria-label="下蹲或进管道">▼</button>
        <button class="touch-button right" type="button" data-game-key="RIGHT" aria-label="向右移动">▶</button>
        <button class="touch-button action" type="button" data-game-key="RUN" aria-label="按住奔跑；火焰形态下发射火球">B</button>
      </div>
      <p class="touch-hint">方向键移动 / 跳跃 / 进管道；按住 B 奔跑或发射火球</p>
    </section>
  </body>
</html>
